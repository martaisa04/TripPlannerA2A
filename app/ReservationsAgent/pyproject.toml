[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ReservationsAgent"
version = "0.1.0"
description = "AgentCore Runtime Application — gestión de reservas de viaje via A2A"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "fastapi >= 0.141.1",
    "httpx >= 0.27.0",
    "mcp ~= 1.24.0",
    "strands-agents[a2a] >= 1.15.0",
    "uvicorn >= 0.53.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
